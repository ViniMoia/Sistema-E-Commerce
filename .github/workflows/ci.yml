name: CI/CD Quality Gates & Security Pipeline

on:
  push:
    branches: [main, master, develop, homologacao_teste]
  pull_request:
    branches: [main, master, develop, homologacao_teste]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validation, Security & Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public"
      SESSION_SECRET: "test-super-secret-key-that-is-at-least-32-chars-long"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Local Evidence Directory
        run: mkdir -p artifacts/validation

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Validate Consumer and Deployment Manifests
        run: npm run test:operations

      - name: Rebuild and Verify Runtime Migration History
        run: npm run test:migrations:isolated

      - name: Reject Missing or Mismatched Test Database Sentinel
        run: npm run test:isolation:negative

      - name: Verify Nuvemshop Bindings on Disposable PostgreSQL
        run: node scripts/verify-nuvemshop-bindings.mjs 2>&1 | tee artifacts/validation/nuvemshop-bindings.log

      - name: Verify Isolated Database and HTTP Server
        run: npm run test:integration:isolated -- --homologation 2>&1 | tee artifacts/validation/integration.log

      - name: Production Build and Two-Instance Runtime Regression
        run: npm run test:production:isolated 2>&1 | tee artifacts/validation/production.log

      - name: Full Maintenance and Recovery in Isolated Production Runtime
        run: npm run test:maintenance:isolated 2>&1 | tee artifacts/validation/maintenance.log

      - name: Relocated Standalone Package and Runtime Regression
        run: npm run test:standalone:isolated 2>&1 | tee artifacts/validation/standalone.log

      - name: Bounded Capacity Pilot with Disposable Providers
        run: npm run test:capacity:isolated 2>&1 | tee artifacts/validation/capacity.log

      - name: Build Cloud Run Image
        run: docker build --build-arg RELEASE_SHA=${{ github.sha }} -t continental-vanderlei:ci .

      - name: Validate Linux Container, Assets, Restart and Consumer
        run: npm run test:container:isolated -- continental-vanderlei:ci 2>&1 | tee artifacts/validation/container.log

      - name: Retain Evidence for This Revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-validation-${{ github.sha }}
          path: artifacts/validation/*.log
          if-no-files-found: ignore
          retention-days: 14
